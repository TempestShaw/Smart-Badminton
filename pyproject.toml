[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-badminton"
version = "0.1.0"
description = "Conservative multimodal rally segmentation for fixed-camera badminton videos"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "imageio-ffmpeg>=0.6",
  "joblib>=1.3",
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<4.12",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "opencv-python>=4.10,<5.1"]
tracknet = ["torch>=2.7"]
hybrid = ["ultralytics>=8.3", "opencv-python>=4.10,<5.1", "torch>=2.7"]
studio = ["fastapi>=0.115,<0.140", "httpx>=0.27,<1", "uvicorn>=0.30"]
full = [
  "fastapi>=0.115,<0.140",
  "httpx>=0.27,<1",
  "opencv-python>=4.10,<5.1",
  "torch>=2.7",
  "ultralytics>=8.3",
  "uvicorn>=0.30",
]
dev = ["httpx>=0.27,<1", "pytest>=8", "ruff>=0.8"]

[project.scripts]
smart-badminton = "smart_badminton.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["smart_badminton*"]

[tool.setuptools.package-data]
smart_badminton = [
  "configs/example_fixed_camera.json",
  "studio_static/*.html",
  "studio_static/*.md",
  "studio_static/_next/static/chunks/*",
  "studio_static/_next/static/*/*",
]

[tool.setuptools.exclude-package-data]
smart_badminton = [
  "configs/dji_0009.json",
  "studio_static/studio.css",
  "studio_static/studio.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
