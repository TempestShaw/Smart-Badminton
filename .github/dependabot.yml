version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /studio-web
    schedule:
      interval: weekly
    ignore:
      # Node type definitions follow the Node major used by CI (22), not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
