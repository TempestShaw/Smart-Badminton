name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,studio]"
      - run: python scripts/repository_guard.py
      - run: ruff check smart_badminton tests scripts
      - run: pytest -q
      - run: python -m smart_badminton --help

  studio:
    name: Studio build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-web/package-lock.json
      - working-directory: studio-web
        run: npm ci
      - working-directory: studio-web
        run: npm run check
      - working-directory: studio-web
        run: npm test
      - working-directory: studio-web
        run: npm run build
      - name: Verify web export
        run: |
          test -s studio-web/out/index.html
          test -s studio-web/out/ffmpeg/ffmpeg-core.wasm
      - working-directory: studio-web
        run: npm run build:embedded
      - name: Verify packaged Studio
        run: |
          test -s smart_badminton/studio_static/index.html
          test -s smart_badminton/studio_static/studio-tutorial.zh-CN.md
          test "$(find smart_badminton/studio_static/_next/static/chunks -type f | wc -l)" -gt 0

  package:
    name: Python wheel
    needs: [python, studio]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python scripts/build_wheel.py --output-directory dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smart-badminton-wheel
          path: dist/*.whl
          if-no-files-found: error
