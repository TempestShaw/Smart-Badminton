name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-web/package-lock.json
      - name: Build React Studio
        if: matrix.python-version == '3.12'
        working-directory: studio-web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Check generated Studio assets
        if: matrix.python-version == '3.12'
        run: git diff --exit-code -- smart_badminton/studio_static
      - run: python -m pip install -e ".[dev,studio]"
      - run: ruff check smart_badminton tests
      - run: pytest
      - run: python -m smart_badminton --help
      - name: Build and verify wheel
        run: python scripts/build_wheel.py --output-directory dist
      - uses: actions/upload-artifact@v4
        with:
          name: smart-badminton-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
