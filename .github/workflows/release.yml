name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-web/package-lock.json
      - name: Verify release version
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - working-directory: studio-web
        run: npm ci
      - working-directory: studio-web
        run: npm run check
      - working-directory: studio-web
        run: npm test
      - working-directory: studio-web
        run: npm run build:embedded
      - name: Verify packaged Studio
        run: |
          test -s smart_badminton/studio_static/index.html
          test -s smart_badminton/studio_static/studio-tutorial.zh-CN.md
          test "$(find smart_badminton/studio_static/_next/static/chunks -type f | wc -l)" -gt 0
      - run: python -m pip install -e ".[dev,studio]" build
      - run: python scripts/repository_guard.py
      - run: pytest -q
      - run: python scripts/build_wheel.py --output-directory dist
      - name: Download verified vision models
        run: smart-badminton install-models --directory models
      - name: Build complete model bundle
        run: python scripts/build_model_bundle.py --output-directory dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl
          dist/smart-badminton-models-*.zip
          --generate-notes
          --verify-tag
